<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/INVICTUS_LOGO.png" />
  <title>My Account — Invictus IMC</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ivory: #F7F6F3; --white: #FFFFFF; --void: #0A0A0A;
      --ink: #1A1A1A; --ink-mid: #555; --border: #E2E0DC;
      --gold: #C8860A; --gold-light: #E09B12; --gold-border: rgba(200,134,10,0.35); --gold-dim: rgba(200,134,10,0.08);
      --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Outfit', sans-serif;
      --success: #2E7D32; --error: #c0392b;
    }
    body { font-family: var(--sans); background: var(--ivory); color: var(--ink); min-height: 100vh; -webkit-text-size-adjust: 100%; }

    .topbar { background: var(--void); padding: 0 16px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-logo { font-family: var(--serif); font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #F5F2EC; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .topbar-back { font-size: 11px; color: rgba(255,255,255,0.45); text-decoration: none; border: 1px solid rgba(255,255,255,0.15); padding: 5px 10px; }
    @media(min-width:600px) { .topbar { padding: 0 24px; } }

    .hero { background: var(--void); padding: 28px 16px; border-bottom: 1px solid rgba(200,134,10,0.15); }
    .hero-eyebrow { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
    .hero-h1 { font-family: var(--serif); font-size: 28px; font-weight: 400; color: #F5F2EC; }
    .hero-h1 em { font-style: italic; color: var(--gold); }
    @media(min-width:600px) { .hero { padding: 36px 24px; } .hero-h1 { font-size: 34px; } }

    .content { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
    @media(min-width:600px) { .content { padding: 36px 24px 60px; } }

    /* AUTH CARD */
    .auth-card { background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 24px 20px; margin-bottom: 16px; }
    @media(min-width:600px) { .auth-card { padding: 32px 28px; } }
    .auth-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    .auth-title { font-family: var(--serif); font-size: 22px; font-weight: 400; color: var(--ink); }
    .auth-toggle { flex-shrink: 0; text-align: right; padding-top: 4px; }
    .auth-toggle span { font-size: 11px; color: var(--ink-mid); display: block; }
    .auth-toggle button { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--gold); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
    .auth-sub { font-size: 13px; color: var(--ink-mid); margin-bottom: 20px; line-height: 1.6; }

    /* ACCOUNT TYPE TOGGLE */
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 20px; }
    .type-btn { font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 12px; background: var(--ivory); border: none; cursor: pointer; color: var(--ink-mid); transition: all 0.15s; }
    .type-btn.active { background: var(--gold); color: var(--void); font-weight: 600; }

    .field-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--ink); display: block; margin-bottom: 6px; margin-top: 14px; }
    .field-opt { font-size: 9px; font-weight: 400; color: var(--ink-mid); }
    .field-input { width: 100%; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--ivory); border: 1px solid var(--border); padding: 13px 14px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; border-radius: 0; }
    .field-input:focus { border-color: var(--gold-border); background: var(--white); }
    .field-input::placeholder { color: rgba(26,26,26,0.3); font-size: 13px; }
    .field-row { display: grid; grid-template-columns: 1fr; gap: 0; }
    @media(min-width:500px) { .field-row { grid-template-columns: 1fr 1fr; gap: 12px; } }
    .field-hint { font-size: 10px; color: var(--ink-mid); margin-top: 4px; }

    .msg { font-size: 13px; padding: 12px 14px; margin-top: 14px; border: 1px solid; line-height: 1.6; display: none; }
    .msg.success { background: rgba(46,125,50,0.08); border-color: rgba(46,125,50,0.3); color: var(--success); display: block; }
    .msg.error { background: rgba(231,76,60,0.08); border-color: rgba(231,76,60,0.3); color: var(--error); display: block; }

    .btn-gold { width: 100%; margin-top: 20px; font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--void); background: var(--gold); border: none; padding: 16px; cursor: pointer; -webkit-appearance: none; border-radius: 0; touch-action: manipulation; }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-outline { width: 100%; margin-top: 10px; font-family: var(--sans); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); background: transparent; border: 1px solid var(--gold-border); padding: 14px; cursor: pointer; -webkit-appearance: none; border-radius: 0; }

    /* ACCOUNT DASHBOARD */
    .account-header { background: var(--white); border: 1px solid var(--border); border-left: 3px solid var(--gold); padding: 20px; margin-bottom: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .account-name { font-family: var(--serif); font-size: 24px; color: var(--ink); margin-bottom: 4px; }
    .account-type-badge { display: inline-block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; padding: 4px 10px; background: var(--gold-dim); border: 1px solid var(--gold-border); color: var(--gold); margin-bottom: 8px; }
    .account-meta { font-size: 12px; color: var(--ink-mid); line-height: 1.8; }
    .account-status { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 10px; border: 1px solid; }
    .status-pending { color: var(--gold); border-color: var(--gold-border); background: var(--gold-dim); }
    .status-approved { color: var(--success); border-color: rgba(46,125,50,0.3); background: rgba(46,125,50,0.08); }

    .section-title { font-family: var(--serif); font-size: 20px; font-weight: 400; color: var(--ink); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .section-wrap { margin-bottom: 24px; }

    .order-card { background: var(--white); border: 1px solid var(--border); padding: 16px; margin-bottom: 10px; }
    .order-card-code { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
    .order-card-title { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
    .order-card-meta { font-size: 12px; color: var(--ink-mid); line-height: 1.7; }
    .order-card-footer { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .bid-amount { font-size: 18px; font-family: var(--serif); color: var(--gold); font-weight: 400; }
    .btn-small-gold { font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--void); background: var(--gold); border: none; padding: 8px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-small-outline { font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); background: transparent; border: 1px solid var(--gold-border); padding: 8px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
    .empty-state { text-align: center; padding: 32px 20px; background: var(--white); border: 1px solid var(--border); }
    .empty-state p { font-size: 13px; color: var(--ink-mid); }

    footer { background: var(--void); padding: 18px 16px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
    .footer-text { font-size: 10px; color: rgba(255,255,255,0.25); }
    .footer-contact { font-size: 11px; color: rgba(200,134,10,0.6); }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/" class="topbar-logo">
    <img src="/INVICTUS_LOGO.png" style="width:24px;height:24px;object-fit:contain;" alt="" />
    <span>Invictus IMC</span>
  </a>
  <a href="/" class="topbar-back">← Website</a>
</div>

<div class="hero">
  <div class="hero-eyebrow">Member Area</div>
  <h1 class="hero-h1">My <em>Account</em></h1>
</div>

<div class="content" id="main-content">
  <div style="text-align:center;padding:40px;color:var(--ink-mid);">Loading...</div>
</div>

<footer>
  <span class="footer-text">© 2025 Invictus IMC · SKYLabs India Private Limited</span>
  <span class="footer-contact">connect@invictusimc.com</span>
</footer>

<script>
  const SUPA_URL = 'https://nmjkzhquoxuuebzyotnx.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tamt6aHF1b3h1dWVienlvdG54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNzY0MDEsImV4cCI6MjA5MTY1MjQwMX0.6uwyWMSLGhG259TY9x-vpUxNiENkYAXOqFEUI3aSv5M';
  const H = { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' };

  let currentUser = null;
  let accountType = null; // 'manufacturer' or 'buyer'
  let showLogin = false;
  let selectedType = 'manufacturer';

  function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h = h & h; }
    return Math.abs(h).toString(36);
  }

  window.onload = () => {
    try {
      const mfr = sessionStorage.getItem('mfr_user');
      const buyer = sessionStorage.getItem('buyer_user');
      if (mfr) { currentUser = JSON.parse(mfr); accountType = 'manufacturer'; }
      else if (buyer) { currentUser = JSON.parse(buyer); accountType = 'buyer'; }
    } catch(e) {}
    render();
  };

  function toggleAuthMode() { showLogin = !showLogin; render(); }
  function setType(t) { selectedType = t; render(); }

  function render() {
    if (currentUser) renderDashboard();
    else renderAuth();
  }

  function renderAuth() {
    document.getElementById('main-content').innerHTML = `
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-title">${showLogin ? 'Login to your account' : 'Sign Up or Login'}</div>
          <div class="auth-toggle">
            <span>${showLogin ? 'New here?' : 'Already registered?'}</span>
            <button onclick="toggleAuthMode()">${showLogin ? 'Create account' : 'Login →'}</button>
          </div>
        </div>
        <p class="auth-sub">${showLogin ? 'Use your mobile number and password.' : 'One account for all your activity on Invictus IMC.'}</p>

        <div class="type-toggle">
          <button class="type-btn ${selectedType==='manufacturer'?'active':''}" onclick="setType('manufacturer')">Manufacturer</button>
          <button class="type-btn ${selectedType==='buyer'?'active':''}" onclick="setType('buyer')">Buyer</button>
        </div>

        ${showLogin ? renderLoginForm() : renderSignupForm()}
      </div>`;
  }

  function renderLoginForm() {
    return `
      <label class="field-label">Mobile Number or Email</label>
      <input type="text" class="field-input" id="l-mobile" placeholder="+91 98765 43210 or you@company.com" autocomplete="username" />
      <label class="field-label">Password</label>
      <input type="password" class="field-input" id="l-password" placeholder="Your password" autocomplete="current-password" />
      <div id="auth-msg" class="msg"></div>
      <button class="btn-gold" onclick="login()">Login →</button>`;
  }

  function renderSignupForm() {
    const isMfr = selectedType === 'manufacturer';
    return `
      <label class="field-label">Company ${isMfr ? '/ Factory' : ''} Name *</label>
      <input type="text" class="field-input" id="s-company" placeholder="${isMfr ? 'Precision Parts Pvt Ltd' : 'Acme Industries Pvt Ltd'}" autocomplete="organization" />
      <div class="field-row">
        <div>
          <label class="field-label">Mobile Number *</label>
          <input type="tel" class="field-input" id="s-mobile" placeholder="+91 98765 43210" autocomplete="tel" />
        </div>
        <div>
          <label class="field-label">Email <span class="field-opt">(optional)</span></label>
          <input type="email" class="field-input" id="s-email" placeholder="you@company.com" autocomplete="email" />
        </div>
      </div>
      <label class="field-label">Set Password *</label>
      <input type="password" class="field-input" id="s-password" placeholder="6–15 characters" autocomplete="new-password" minlength="6" maxlength="15" />
      <div class="field-hint">6 to 15 characters. No special character restrictions.</div>
      <div id="auth-msg" class="msg"></div>
      <button class="btn-gold" onclick="signup()">Create Account →</button>`;
  }

  async function signup() {
    const company = document.getElementById('s-company')?.value.trim();
    const mobile = document.getElementById('s-mobile')?.value.trim();
    const email = (document.getElementById('s-email')?.value.trim()||'').toLowerCase();
    const password = document.getElementById('s-password')?.value;
    const msg = document.getElementById('auth-msg');

    if (!company || !mobile || !password) { showMsg(msg,'error','Company name, mobile and password are required.'); return; }
    if (password.length < 6 || password.length > 15) { showMsg(msg,'error','Password must be 6–15 characters.'); return; }

    showMsg(msg,'success','Creating your account...');
    const hash = simpleHash(password);
    const table = selectedType === 'manufacturer' ? 'manufacturers' : 'buyers';
    const sessionKey = selectedType === 'manufacturer' ? 'mfr_user' : 'buyer_user';

    try {
      // Check mobile uniqueness within business line
      const mfrTables = selectedType === 'manufacturer'
        ? [
            fetch(`${SUPA_URL}/rest/v1/manufacturers?poc_phone=eq.${encodeURIComponent(mobile)}&select=id`, { headers: H }).then(r=>r.json()),
            fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts?mobile=eq.${encodeURIComponent(mobile)}&select=id`, { headers: H }).then(r=>r.json())
          ]
        : [fetch(`${SUPA_URL}/rest/v1/buyers?poc_phone=eq.${encodeURIComponent(mobile)}&select=id`, { headers: H }).then(r=>r.json())];
      const mobResults = await Promise.all(mfrTables);
      if (mobResults.some(r => r?.length)) {
        showMsg(msg, 'error', 'This mobile number is already registered. Please login to your existing account.');
        return;
      }
      if (email) {
        const emailTables = selectedType === 'manufacturer'
          ? [
              fetch(`${SUPA_URL}/rest/v1/manufacturers?poc_email=eq.${encodeURIComponent(email)}&select=id`, { headers: H }).then(r=>r.json()),
              fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts?email=eq.${encodeURIComponent(email)}&select=id`, { headers: H }).then(r=>r.json())
            ]
          : [fetch(`${SUPA_URL}/rest/v1/buyers?poc_email=eq.${encodeURIComponent(email)}&select=id`, { headers: H }).then(r=>r.json())];
        const emailResults = await Promise.all(emailTables);
        if (emailResults.some(r => r?.length)) {
          showMsg(msg, 'error', 'This email is already registered. Please login to your existing account.');
          return;
        }
      }

      const existing = []; // No existing record since we checked above

      let userId;
      if (existing?.length) {
        userId = existing[0].id;
        await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${userId}`, {
          method: 'PATCH', headers: { ...H, 'Prefer': 'return=minimal' },
          body: JSON.stringify({ password_hash: hash, company_name: company, poc_email: email||null, mobile })
        });
      } else {
        const insertBody = {
          company_name: company,
          poc_phone: mobile,
          mobile: mobile,
          poc_email: email||null,
          password_hash: hash,
          status: 'pending',
          submitted_at: new Date().toISOString()
        };
        const res = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
          method: 'POST', headers: { ...H, 'Prefer': 'return=representation' },
          body: JSON.stringify(insertBody)
        });
        if (!res.ok) {
          const errText = await res.text();
          if(JSON.parse(errText)?.code==="23505") throw new Error("DUPLICATE"); throw new Error(errText);
        }
        const [rec] = await res.json();
        userId = rec.id;
      }

      // For manufacturers: also create/update manufacturer_accounts (for order bidding UUID)
      let maUUID = null;
      if (selectedType === 'manufacturer') {
        const maCheck = await fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts?mobile=eq.${encodeURIComponent(mobile)}&select=id`, { headers: H });
        const maExisting = await maCheck.json();
        if (maExisting?.length) {
          maUUID = maExisting[0].id;
        } else {
          const maRes = await fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts`, {
            method: 'POST', headers: { ...H, 'Prefer': 'return=representation' },
            body: JSON.stringify({ company_name: company, mobile, email: email||null, password_hash: hash })
          });
          if (maRes.ok) { const [ma] = await maRes.json(); maUUID = ma.id; }
        }
      }

      currentUser = {
        id: maUUID || userId,
        company_name: company, mobile, email, type: selectedType
      };
      accountType = selectedType;
      sessionStorage.setItem(sessionKey, JSON.stringify(currentUser));
      render();
    } catch(e) { showMsg(msg,'error', e.message==='DUPLICATE' ? 'This mobile number or email is already registered. Please login to your existing account.' : 'Error: ' + e.message); }
  }

  async function login() {
    const identifier = document.getElementById('l-mobile')?.value.trim();
    const password = document.getElementById('l-password')?.value;
    const msg = document.getElementById('auth-msg');
    if (!identifier || !password) { showMsg(msg,'error','Enter your mobile/email and password.'); return; }

    showMsg(msg,'success','Logging in...');
    const hash = simpleHash(password);
    const table = selectedType === 'manufacturer' ? 'manufacturers' : 'buyers';
    const sessionKey = selectedType === 'manufacturer' ? 'mfr_user' : 'buyer_user';

    try {
      // Try mobile first, then email
      const isEmail = identifier.includes('@');
      let users = [];

      if (!isEmail) {
        const res = await fetch(`${SUPA_URL}/rest/v1/${table}?poc_phone=eq.${encodeURIComponent(identifier)}&select=*`, { headers: H });
        users = await res.json();
      }
      // If not found by mobile or it's an email, try email
      if (!users?.length) {
        const res = await fetch(`${SUPA_URL}/rest/v1/${table}?poc_email=eq.${encodeURIComponent(identifier.toLowerCase())}&select=*`, { headers: H });
        users = await res.json();
      }

      if (!users?.length) { showMsg(msg,'error','No account found. Please sign up first.'); return; }
      const u = users[0];
      if (!u.password_hash) { showMsg(msg,'error','No password set. Please sign up to set a password.'); return; }
      if (u.password_hash !== hash) { showMsg(msg,'error','Incorrect password.'); return; }

      await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${u.id}`, { method: 'PATCH', headers: { ...H, 'Prefer': 'return=minimal' }, body: JSON.stringify({ last_login: new Date().toISOString() }) });

      let loginId = u.id;
      if (selectedType === 'manufacturer') {
        const mobile = u.poc_phone || identifier;
        const maRes = await fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts?mobile=eq.${encodeURIComponent(mobile)}&select=id`, { headers: H });
        const maUsers = await maRes.json();
        if (maUsers?.length) loginId = maUsers[0].id;
      }

      currentUser = { id: loginId, company_name: u.company_name, mobile: u.poc_phone||identifier, email: u.poc_email, status: u.status, type: selectedType };
      accountType = selectedType;
      sessionStorage.setItem(sessionKey, JSON.stringify(currentUser));
      render();
    } catch(e) { showMsg(msg,'error','Error: ' + e.message); }
  }

  async function renderDashboard() {
    const isMfr = accountType === 'manufacturer';
    let html = `
      <div class="account-header">
        <div>
          <div class="account-type-badge">${isMfr ? 'Manufacturer' : 'Buyer'}</div>
          <div class="account-name">${currentUser.company_name}</div>
          <div class="account-meta">
            ${currentUser.mobile ? `📱 ${currentUser.mobile}<br/>` : ''}
            ${currentUser.email ? `✉ ${currentUser.email}<br/>` : ''}
          </div>
          ${currentUser.status ? `<span class="account-status status-${currentUser.status}">${currentUser.status}</span>` : ''}
        </div>
        <button class="btn-small-outline" onclick="logout()">Sign Out</button>
      </div>`;

    if (isMfr) {
      html += await renderMfrDashboard();
    } else {
      html += await renderBuyerDashboard();
    }

    document.getElementById('main-content').innerHTML = html;
  }

  async function renderMfrDashboard() {
    let html = '';

    // Get manufacturer_accounts id by mobile — this is the UUID needed for bids
    let maId = null;
    try {
      const maRes = await fetch(`${SUPA_URL}/rest/v1/manufacturer_accounts?mobile=eq.${encodeURIComponent(currentUser.mobile)}&select=id`, { headers: H });
      const maUsers = await maRes.json();
      if (maUsers?.length) maId = maUsers[0].id;
    } catch(e) {}

    // My Bids
    try {
      if (maId) {
        const bidsRes = await fetch(`${SUPA_URL}/rest/v1/order_bids?manufacturer_id=eq.${maId}&order=submitted_at.desc&select=*`, { headers: H });
        const bids = await bidsRes.json();

        html += `<div class="section-wrap"><div class="section-title">My Bids (${bids.length})</div>`;
        if (!bids.length) {
          html += `<div class="empty-state"><p>No bids submitted yet.</p></div>`;
        } else {
          const orderIds = [...new Set(bids.map(b => b.order_id))];
          const ordersRes = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders?id=in.(${orderIds.join(',')})&select=id,order_code,part_name,status,slug`, { headers: H });
          const orders = await ordersRes.json();
          const orderMap = {};
          orders.forEach(o => { orderMap[o.id] = o; });

          bids.forEach(b => {
            const o = orderMap[b.order_id] || {};
            const bs = b.status || 'submitted';
            const bsMap = {
              awarded:     { label: '🎉 Awarded to You', color: '#2E7D32' },
              rejected:    { label: 'Not Selected This Time', color: '#c0392b' },
              shortlisted: { label: 'Shortlisted', color: '#4A90D9' },
              submitted:   { label: 'Bid Submitted — Under Review', color: 'var(--ink-mid)' }
            };
            const bsInfo = bsMap[bs] || bsMap.submitted;
            html += `<div class="order-card">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
                <div class="order-card-code">${o.order_code||'—'}</div>
                <span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border:1px solid;color:${bsInfo.color};border-color:${bsInfo.color};white-space:nowrap;">${bsInfo.label}</span>
              </div>
              <div class="order-card-title">${o.part_name||'—'}</div>
              <div class="order-card-meta">Order Status: ${o.status||'—'} · Submitted ${new Date(b.submitted_at).toLocaleDateString('en-IN')}</div>
              <div class="order-card-footer">
                <div class="bid-amount">₹${Number(b.price_per_unit).toLocaleString('en-IN')}/unit ${b.partial_bid ? `<span style="font-size:12px;color:var(--ink-mid);">(${b.partial_quantity})</span>` : ''}</div>
                ${o.status === 'open' ? `<a href="/order/${o.slug||o.id}" class="btn-small-gold">View Order</a>` : '<span style="font-size:11px;color:var(--ink-mid);">Order Closed</span>'}
              </div>
              ${b.notes ? `<div style="font-size:12px;color:var(--ink-mid);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">${b.notes}</div>` : ''}
            </div>`;
          });
        }
        html += `</div>`;
      }
    } catch(e) { html += `<div class="empty-state"><p>Error loading bids: ${e.message}</p></div>`; }

    // Open Orders to Bid On
    try {
      const ordersRes = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders?status=eq.open&parent_order_id=is.null&order=created_at.desc&select=*`, { headers: H });
      const allOrders = await ordersRes.json();

      html += `<div class="section-wrap">
        <div class="section-title">Open Orders (${allOrders.length})</div>
        <input type="text" id="order-search" class="field-input" placeholder="Search by part name, industry, material..." oninput="filterOrders()" style="margin-bottom:16px;" />
        <div id="orders-list"></div>
        <div id="orders-pagination" style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;"></div>
      </div>`;

      // Store orders globally for filtering/pagination
      window._allOrders = allOrders;
      window._ordersPage = 0;
      window._ordersPerPage = 8;

      setTimeout(() => { filterOrders(); }, 50);
    } catch(e) {
      html += `<div class="empty-state"><p>Could not load orders: ${e.message}</p></div>`;
    }

    return html;
  }

  function filterOrders() {
    const q = (document.getElementById('order-search')?.value || '').toLowerCase();
    const filtered = (window._allOrders || []).filter(o =>
      !q || (o.part_name||'').toLowerCase().includes(q) ||
      (o.industry||'').toLowerCase().includes(q) ||
      (o.material||'').toLowerCase().includes(q) ||
      (o.order_code||'').toLowerCase().includes(q)
    );
    window._filteredOrders = filtered;
    window._ordersPage = 0;
    renderOrdersPage();
  }

  function renderOrdersPage() {
    const orders = window._filteredOrders || window._allOrders || [];
    const page = window._ordersPage || 0;
    const perPage = window._ordersPerPage || 8;
    const start = page * perPage;
    const pageOrders = orders.slice(start, start + perPage);
    const totalPages = Math.ceil(orders.length / perPage);

    const list = document.getElementById('orders-list');
    const pag = document.getElementById('orders-pagination');
    if (!list) return;

    if (!pageOrders.length) {
      list.innerHTML = `<div class="empty-state"><p>No orders match your search.</p></div>`;
      if (pag) pag.innerHTML = '';
      return;
    }

    list.innerHTML = pageOrders.map(o => `
      <div class="order-card" style="display:grid;grid-template-columns:${o.drawing_url?'100px 1fr':'1fr'};gap:12px;align-items:start;margin-bottom:10px;">
        ${o.drawing_url ? `<img src="${o.drawing_url}" style="width:100px;height:80px;object-fit:contain;background:#f8f8f8;border:1px solid var(--border);" alt="${o.part_name}" />` : ''}
        <div>
          <div class="order-card-code">${o.order_code}</div>
          <div class="order-card-title">${o.part_name}</div>
          <div class="order-card-meta">
            ${o.industry ? `${o.industry} · ` : ''}${o.monthly_quantity ? o.monthly_quantity+'/mo' : o.annual_quantity || ''}
          </div>
          <div class="order-card-footer" style="margin-top:8px;">
            <span></span>
            <a href="/order/${o.slug||o.id}" class="btn-small-gold">View &amp; Bid →</a>
          </div>
        </div>
      </div>`).join('');

    // Pagination
    if (pag) {
      pag.innerHTML = '';
      for (let i = 0; i < totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i + 1;
        btn.style.cssText = `font-family:var(--sans);font-size:11px;padding:6px 12px;border:1px solid ${i===page?'var(--gold)':'var(--border)'};background:${i===page?'var(--gold)':'transparent'};color:${i===page?'var(--void)':'var(--ink-mid)'};cursor:pointer;`;
        btn.onclick = () => { window._ordersPage = i; renderOrdersPage(); };
        pag.appendChild(btn);
      }
    }
  }

  async function renderBuyerDashboard() {
    let html = '';
    try {
      const res = await fetch(`${SUPA_URL}/rest/v1/buyers?poc_phone=eq.${encodeURIComponent(currentUser.mobile)}&select=*`, { headers: H });
      const buyers = await res.json();
      const b = buyers?.[0];

      if (b) {
        const statusColor = b.status === 'approved' ? '#2E7D32' : b.status === 'rejected' ? '#c0392b' : 'var(--gold)';
        html += `<div class="section-wrap">
          <div class="section-title">Account Status</div>
          <div class="order-card">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
              <div>
                <div class="order-card-title">${b.company_name}</div>
                <div class="order-card-meta">${b.city||''}${b.state?', '+b.state:''}</div>
              </div>
              <span style="font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;border:1px solid;color:${statusColor};border-color:${statusColor};">${b.status||'Pending Review'}</span>
            </div>
          </div>
        </div>`;

        // My submitted orders
        const ordersRes = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders?buyer_id=eq.${b.id}&order=created_at.desc&select=*`, { headers: H });
        const myOrders = await ordersRes.json();
        window._myBuyerOrders = myOrders;
        window._editingOrderId = null;

        html += `<div class="section-wrap">
          <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
            <span>My Orders (${myOrders.length})</span>
            <button class="btn-small-gold" onclick="toggleBuyerOrderForm()" id="add-order-btn" style="font-size:10px;padding:8px 16px;">+ Add Order</button>
          </div>

          <!-- ORDER FORM (shared for add + edit) -->
          <div id="buyer-order-form" style="display:none;background:var(--white);border:1px solid var(--border);border-left:3px solid var(--gold);padding:24px;margin-bottom:16px;">
            <input type="hidden" id="bo-buyer-id" value="${b.id}" />
            <input type="hidden" id="bo-edit-id" value="" />
            <div style="font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:4px;" id="bo-form-title">Submit a Manufacturing Order</div>
            <p style="font-size:12px;color:var(--ink-mid);margin-bottom:20px;" id="bo-form-sub">Our team will review and publish your order within 48 hours. Manufacturers will then be able to bid on it.</p>
            <label class="field-label">Part Name *</label>
            <input type="text" class="field-input" id="bo-part" placeholder="e.g. Injection Moulded Plastic Casing" />
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <label class="field-label">Industry *</label>
                <input type="text" class="field-input" id="bo-industry" placeholder="e.g. Consumer Electronics" />
              </div>
              <div>
                <label class="field-label">Annual Quantity *</label>
                <input type="text" class="field-input" id="bo-annual" placeholder="e.g. 50,000 units/year" />
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div>
                <label class="field-label">Monthly Quantity</label>
                <input type="text" class="field-input" id="bo-monthly" placeholder="e.g. 4,000 units/month" />
              </div>
              <div>
                <label class="field-label">Material *</label>
                <input type="text" class="field-input" id="bo-material" placeholder="e.g. ABS Plastic" />
              </div>
            </div>
            <label class="field-label">Primary Process</label>
            <input type="text" class="field-input" id="bo-process" placeholder="e.g. Injection Moulding" />
            <label class="field-label">Additional Details</label>
            <textarea class="field-input" id="bo-details" rows="3" placeholder="Any certifications, tolerances, surface finish requirements..."></textarea>
            <label class="field-label" id="bo-drawing-label">Technical Drawing * <span style="font-size:9px;font-weight:400;color:var(--ink-mid);">(image or PDF)</span></label>
            <input type="file" class="field-input" id="bo-drawing" accept="image/*,.pdf" style="padding:8px;" />
            <div id="bo-current-drawing" style="font-size:11px;color:var(--ink-mid);margin-top:4px;"></div>
            <div id="bo-msg" class="msg"></div>
            <div style="display:flex;gap:10px;margin-top:16px;">
              <button class="btn-small-gold" onclick="submitBuyerOrder()" id="bo-submit-btn" style="padding:12px 24px;font-size:11px;">Submit Order →</button>
              <button onclick="toggleBuyerOrderForm()" style="font-family:var(--sans);font-size:11px;padding:12px 20px;background:transparent;border:1px solid var(--border);color:var(--ink-mid);cursor:pointer;">Cancel</button>
            </div>
          </div>`;

        // Orders list
        if (!myOrders.length) {
          html += `<div class="empty-state"><p>No orders submitted yet. Click "+ Add Order" to submit your first manufacturing requirement.</p></div>`;
        } else {
          myOrders.forEach(o => {
            const rs = o.review_status || 'pending_review';
            const rsColor = rs === 'open' ? '#2E7D32' : rs === 'rejected' ? '#c0392b' : 'var(--gold)';
            const rsLabel = rs === 'open' ? 'Open for Bids' : rs === 'rejected' ? 'Rejected' : 'Pending Review';
            const canEdit = rs === 'pending_review' || rs === 'rejected';
            html += `<div class="order-card" style="display:grid;grid-template-columns:${o.drawing_url?'80px 1fr':'1fr'};gap:12px;align-items:start;margin-bottom:10px;">
              ${o.drawing_url ? `<img src="${o.drawing_url}" style="width:80px;height:64px;object-fit:contain;background:#f8f8f8;border:1px solid var(--border);" alt="${o.part_name}" />` : ''}
              <div>
                <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                  <div>
                    <div class="order-card-code">${o.order_code||'Pending'}</div>
                    <div class="order-card-title">${o.part_name}</div>
                    <div class="order-card-meta">${o.industry||''} ${o.annual_quantity?'· '+o.annual_quantity:''}</div>
                  </div>
                  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                    <span style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border:1px solid;color:${rsColor};border-color:${rsColor};white-space:nowrap;">${rsLabel}</span>
                    ${canEdit ? `<button onclick="editBuyerOrder('${o.id}')" style="font-family:var(--sans);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);background:none;border:1px solid var(--gold-border,var(--border));padding:4px 10px;cursor:pointer;">Edit</button>` : ''}
                  </div>
                </div>
              </div>
            </div>`;
          });
        }
        html += `</div>`;
      }
    } catch(e) {
      html += `<div class="empty-state"><p>Error loading account: ${e.message}</p></div>`;
    }
    html += `<div class="empty-state" style="margin-top:8px;"><p>Questions? <a href="mailto:connect@invictusimc.com" style="color:var(--gold);">connect@invictusimc.com</a> · <a href="tel:+918217367948" style="color:var(--gold);">+91 82173 67948</a></p></div>`;
    return html;
  }

  function toggleBuyerOrderForm() {
    const form = document.getElementById('buyer-order-form');
    const btn = document.getElementById('add-order-btn');
    const show = form.style.display === 'none';
    if (show) resetBuyerOrderForm(); // opening via "+ Add Order" always starts fresh (not editing)
    form.style.display = show ? 'block' : 'none';
    btn.textContent = show ? '✕ Cancel' : '+ Add Order';
    if (show) form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function resetBuyerOrderForm() {
    window._editingOrderId = null;
    document.getElementById('bo-edit-id').value = '';
    ['bo-part','bo-industry','bo-annual','bo-monthly','bo-material','bo-process','bo-details'].forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
    const fileInput = document.getElementById('bo-drawing');
    if (fileInput) fileInput.value = '';
    document.getElementById('bo-current-drawing').innerHTML = '';
    document.getElementById('bo-drawing-label').innerHTML = 'Technical Drawing * <span style="font-size:9px;font-weight:400;color:var(--ink-mid);">(image or PDF)</span>';
    document.getElementById('bo-form-title').textContent = 'Submit a Manufacturing Order';
    document.getElementById('bo-form-sub').textContent = 'Our team will review and publish your order within 48 hours. Manufacturers will then be able to bid on it.';
    document.getElementById('bo-submit-btn').textContent = 'Submit Order →';
  }

  function editBuyerOrder(id) {
    const order = (window._myBuyerOrders || []).find(o => String(o.id) === String(id));
    if (!order) return;
    window._editingOrderId = id;
    document.getElementById('bo-edit-id').value = id;
    document.getElementById('bo-part').value = order.part_name || '';
    document.getElementById('bo-industry').value = order.industry || '';
    document.getElementById('bo-annual').value = order.annual_quantity || '';
    document.getElementById('bo-monthly').value = order.monthly_quantity || '';
    document.getElementById('bo-material').value = order.material || '';
    document.getElementById('bo-process').value = order.primary_process || '';
    document.getElementById('bo-details').value = order.additional_details || '';
    document.getElementById('bo-drawing-label').innerHTML = 'Technical Drawing <span style="font-size:9px;font-weight:400;color:var(--ink-mid);">(leave blank to keep the current file)</span>';
    document.getElementById('bo-current-drawing').innerHTML = order.drawing_url ? `Current file: <a href="${order.drawing_url}" target="_blank" style="color:var(--gold);">view drawing</a>` : '';
    document.getElementById('bo-form-title').textContent = 'Edit Manufacturing Order';
    document.getElementById('bo-form-sub').textContent = 'Changes will be reviewed again by our team before the order stays live.';
    document.getElementById('bo-submit-btn').textContent = 'Update Order →';
    document.getElementById('bo-msg').innerHTML = '';
    const form = document.getElementById('buyer-order-form');
    const btn = document.getElementById('add-order-btn');
    form.style.display = 'block';
    btn.textContent = '✕ Cancel';
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function toSlug(str) { return str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

  async function submitBuyerOrder() {
    const editId = document.getElementById('bo-edit-id')?.value || window._editingOrderId;
    const buyerId = document.getElementById('bo-buyer-id')?.value;
    const part = document.getElementById('bo-part')?.value.trim();
    const industry = document.getElementById('bo-industry')?.value.trim();
    const annual = document.getElementById('bo-annual')?.value.trim();
    const material = document.getElementById('bo-material')?.value.trim();
    const monthly = document.getElementById('bo-monthly')?.value.trim();
    const process = document.getElementById('bo-process')?.value.trim();
    const details = document.getElementById('bo-details')?.value.trim();
    const fileInput = document.getElementById('bo-drawing');
    const msg = document.getElementById('bo-msg');

    if (!part) { showMsg(msg, 'error', 'Part name is required.'); return; }
    if (!industry) { showMsg(msg, 'error', 'Industry is required.'); return; }
    if (!annual) { showMsg(msg, 'error', 'Annual quantity is required.'); return; }
    if (!material) { showMsg(msg, 'error', 'Material is required.'); return; }
    // Drawing is only mandatory when adding a new order — editing can keep the existing file
    if (!editId && !fileInput?.files?.[0]) { showMsg(msg, 'error', 'Technical drawing is required.'); return; }

    try {
      let drawingUrl = null;
      if (fileInput?.files?.[0]) {
        showMsg(msg, 'success', 'Uploading drawing...');
        const orderCodeForFile = editId ? ('EDIT-' + Date.now().toString(36).toUpperCase()) : ('IMC-' + Date.now().toString(36).toUpperCase().slice(-6));
        const file = fileInput.files[0];
        const ext = file.name.split('.').pop();
        const fileName = `${orderCodeForFile}.${ext}`;
        const uploadRes = await fetch(`${SUPA_URL}/storage/v1/object/order-drawings/${fileName}`, {
          method: 'POST', headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': file.type }, body: file
        });
        if (uploadRes.ok) drawingUrl = `${SUPA_URL}/storage/v1/object/public/order-drawings/${fileName}`;
        else { showMsg(msg, 'error', 'Drawing upload failed. Please try again.'); return; }
      }

      if (editId) {
        // UPDATE existing order — send back for review since details changed
        showMsg(msg, 'success', 'Saving changes...');
        const body = {
          part_name: part, industry, annual_quantity: annual, monthly_quantity: monthly||null,
          material, primary_process: process||null, additional_details: details||null,
          review_status: 'pending_review', featured: false
        };
        if (drawingUrl) body.drawing_url = drawingUrl;
        const res = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders?id=eq.${editId}`, {
          method: 'PATCH', headers: { ...H, 'Prefer': 'return=minimal' }, body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error(await res.text());
        showMsg(msg, 'success', '✓ Order updated! Our team will review the changes before it goes live again.');
      } else {
        // CREATE new order
        const orderCode = 'IMC-' + Date.now().toString(36).toUpperCase().slice(-6);
        const baseSlug = [industry, part].map(toSlug).join('-').substring(0, 80);
        let slug = baseSlug, suffix = 2;
        while (true) {
          const check = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders?slug=eq.${slug}&select=id`, { headers: H });
          const ex = await check.json();
          if (!ex.length) break;
          slug = `${baseSlug}-${suffix++}`;
        }
        showMsg(msg, 'success', 'Creating order...');
        const res = await fetch(`${SUPA_URL}/rest/v1/manufacturing_orders`, {
          method: 'POST',
          headers: { ...H, 'Prefer': 'return=representation' },
          body: JSON.stringify({
            order_code: orderCode, slug, part_name: part, industry, annual_quantity: annual,
            monthly_quantity: monthly||null, material, primary_process: process||null,
            additional_details: details||null, drawing_url: drawingUrl,
            status: 'open', review_status: 'pending_review', buyer_id: parseInt(buyerId)
          })
        });
        if (!res.ok) throw new Error(await res.text());
        showMsg(msg, 'success', '✓ Order submitted! Our team will review and publish it within 48 hours.');
      }

      resetBuyerOrderForm();
      // Reload dashboard to show updated list
      setTimeout(() => renderDashboard(), 1500);
    } catch(e) {
      showMsg(msg, 'error', 'Error: ' + e.message);
    }
  }

  function logout() {
    currentUser = null; accountType = null; showLogin = false;
    sessionStorage.removeItem('mfr_user');
    sessionStorage.removeItem('buyer_user');
    render();
  }

  function showMsg(el, type, text) {
    if (!el) return;
    el.className = 'msg ' + type; el.textContent = text;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
</script>
</body>
</html>
